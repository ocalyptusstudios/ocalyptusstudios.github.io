<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <clipPath id="ic">
      <rect x="0" y="0" width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#87CEEB"/>

  <g clip-path="url(#ic)">
    <rect x="0" y="0" width="1024" height="1024" fill="#87CEEB"/>

    <!-- Cloud -->
    <circle cx="228" cy="292" r="58"  fill="white" opacity="0.90"/>
    <circle cx="302" cy="248" r="76"  fill="white" opacity="0.90"/>
    <circle cx="384" cy="266" r="60"  fill="white" opacity="0.90"/>
    <circle cx="444" cy="294" r="44"  fill="white" opacity="0.90"/>

    <!-- Lightning bolt -->
    <polygon points="868,100 832,220 876,220 848,332 958,208 910,208 868,100"
             fill="#FFD24A" stroke="#B8860B" stroke-width="7" stroke-linejoin="round"/>

    <!-- BOX 1 - Bottom - Orange - center (512, 774) -->
    <g transform="rotate(3.5, 512, 774)">
      <rect x="393" y="655" width="238" height="238" rx="28" fill="#2D2D2D"/>
      <rect x="397" y="659" width="230" height="230" rx="22" fill="#C94400"/>
      <rect x="405" y="667" width="214" height="214" rx="16" fill="#FF6B35"/>
      <rect x="432" y="694" width="80"  height="48"  rx="10" fill="rgba(255,255,255,0.38)"/>
    </g>

    <!-- BOX 2 - Middle - Teal - center (546, 544) -->
    <g transform="rotate(-2.5, 546, 544)">
      <rect x="427" y="425" width="238" height="238" rx="28" fill="#2D2D2D"/>
      <rect x="431" y="429" width="230" height="230" rx="22" fill="#2E9E97"/>
      <rect x="439" y="437" width="214" height="214" rx="16" fill="#4ECDC4"/>
      <rect x="466" y="464" width="80"  height="48"  rx="10" fill="rgba(255,255,255,0.38)"/>
    </g>

    <!-- BOX 3 - Top - Yellow - center (478, 314) -->
    <g transform="rotate(4, 478, 314)">
      <rect x="359" y="195" width="238" height="238" rx="28" fill="#2D2D2D"/>
      <rect x="363" y="199" width="230" height="230" rx="22" fill="#C9A500"/>
      <rect x="371" y="207" width="214" height="214" rx="16" fill="#FFE66D"/>
      <rect x="398" y="234" width="80"  height="48"  rx="10" fill="rgba(255,255,255,0.38)"/>
    </g>
  </g>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="none" stroke="#1A1A2E" stroke-width="10"/>

</svg>
